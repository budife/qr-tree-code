# Reproduces the live nginx container. Stop the existing `qr` container first
# if you want to recreate it from this file; NPM owns the public routing/SSL.
services:
  web:
    image: nginx:alpine
    container_name: qr
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
