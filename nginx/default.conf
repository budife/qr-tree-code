server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets. Compression and immutable caching are applied by
    # Nginx Proxy Manager at /qr/assets/, so they are not repeated here.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
